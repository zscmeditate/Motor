; PlatformIO 工程 — STM32F030F4P6TR 电机驱动板
; =============================================

[env:motor-board]
platform    = ststm32
board       = demo_f030f4          ; STM32F030F4P6，48MHz
framework   = stm32cube           ; 使用 STM32Cube HAL 库

; —— 上传/调试工具 ——
upload_protocol = stlink           ; 板子上留了 SWD 接口 (J1)
debug_tool      = stlink
; 如果 OpenOCD 链路不通，改成 upload_protocol = dfu（BOOT0 拉高进串口烧录）

; —— PlatformIO 框架模式：手写 HAL init + CubeMX .ioc 作为参考 ——
; PlatformIO 会为 demo_f030f4 自动提供 STM32F030F4P6 的 linker script

; —— 编译选项 ——
build_flags =
    -D USE_HAL_DRIVER
    -D STM32F030x6
    -D HSE_VALUE=8000000           ; 如果板子上没焊晶振，改成 HSI_VALUE=48000000
    -std=gnu11
    -Wall
    -Wextra

; —— 串口监视器（调试输出用 PA9/PA10 或 USART2 PA2/PA3）——
monitor_speed = 115200
